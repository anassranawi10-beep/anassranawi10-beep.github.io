<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="author" content="Tu Nombre">
  <meta name="description" content="Formulario de contacto con el restaurante">
  <meta name="keywords" content="contacto, formulario, restaurante">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header>
    <h1>Contacto</h1>
  </header>
  <nav>
    <ul>
      <li><a href="index.html">Menú principal</a></li>
      <li><a href="Restaurante.html">Restaurante</a></li>
      <li><a href="horario.html">Horario</a></li>
      <li><a href="Formularios-cuestionario.html">Cuestionario</a></li>
      <li><a href="restaurante-reserva.html">Reserva</a></li>
      <li><a href="restaurante-resena.html">Reseña</a></li>
    </ul>
  </nav>
  <main>
    <form action="#" method="post" class="tarjeta">
      <h2>Envíenos su mensaje</h2>
      <div class="fila">
        <div class="campo"><label for="nombre">Su nombre</label><input type="text" id="nombre" name="nombre" placeholder="Su nombre" required></div>
        <div class="campo"><label for="email">Su correo electrónico</label><input type="email" id="email" name="email" placeholder="Su correo electrónico" required></div>
        <div class="campo"><label for="telefono">Su teléfono</label><input type="tel" id="telefono" name="telefono" placeholder="Su teléfono"></div>
      </div>
      <div class="fila">
        <div class="campo"><label for="asunto">Asunto</label><input type="text" id="asunto" name="asunto" placeholder="Asunto" required></div>
      </div>
      <div class="fila">
        <div class="campo"><label for="mensaje">Su mensaje</label><textarea id="mensaje" name="mensaje" rows="8" maxlength="500" placeholder="Su mensaje" required></textarea></div>
      </div>
      <p class="pequeno">0 / 500</p>
      <p class="derecha"><button type="submit">ENVIAR</button></p>
    </form>
  </main>
  <footer>
    <a href="index.html">Volver al menú principal</a>
    <a href="Restaurante.html">Volver al menú del restaurante</a>
    <p>Lenguajes de Marcas - Actividad 5: Formularios</p>
  </footer>
</body>
</html>
