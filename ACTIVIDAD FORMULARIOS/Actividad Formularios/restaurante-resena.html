<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="author" content="Tu Nombre">
  <meta name="description" content="Formulario para escribir la reseña de un plato">
  <meta name="keywords" content="reseña, plato, formulario, restaurante">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reseña de un plato</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header>
    <h1>Reseña</h1>
  </header>
  <nav>
    <ul>
      <li><a href="index.html">Menú principal</a></li>
      <li><a href="Restaurante.html">Restaurante</a></li>
      <li><a href="horario.html">Horario</a></li>
      <li><a href="Formularios-cuestionario.html">Cuestionario</a></li>
      <li><a href="restaurante-reserva.html">Reserva</a></li>
      <li><a href="restaurante-contacto.html">Contacto</a></li>
    </ul>
  </nav>
  <main>
    <form action="#" method="post" class="tarjeta">
      <h2>Reseña de un plato</h2>
      <div class="fila">
        <div class="campo"><label for="plato">Plato</label>
          <select id="plato" name="plato" required>
            <option value="">-- Elija un plato --</option>
            <option value="salmorejo">Salmorejo cordobés</option>
            <option value="rabo-de-toro">Rabo de toro</option>
            <option value="flan">Flan de huevo</option>
          </select>
        </div>
      </div>
      <div class="fila">
        <div class="campo"><label for="nombre">Nombre de quien realiza la reseña</label><input type="text" id="nombre" name="nombre" placeholder="Nombre de quien realiza la reseña" required></div>
      </div>
      <div class="fila">
        <div class="campo"><label for="resena">Reseña del plato</label><textarea id="resena" name="resena" rows="6" placeholder="Reseña del plato" required></textarea></div>
      </div>
      <p class="derecha"><button type="submit">ENVIAR</button></p>
    </form>
  </main>
  <footer>
    <a href="index.html">Volver al menú principal</a>
    <a href="Restaurante.html">Volver al menú del restaurante</a>
    <p>Lenguajes de Marcas - Actividad 5: Formularios</p>
  </footer>
</body>
</html>
