<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="author" content="Tu Nombre">
  <meta name="description" content="Hoja de inscripción en ciclos formativos de grado superior">
  <meta name="keywords" content="inscripción, ciclos formativos, grado superior, formulario">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hoja de inscripción en los ciclos formativos de grado superior</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header>
    <h1>HOJA DE INSCRIPCIÓN EN LOS CICLOS FORMATIVOS DE GRADO SUPERIOR</h1>
  </header>
  <nav>
    <ul>
      <li><a href="index.html">Menú principal</a></li>
      <li><a href="index5.html">Restaurante</a></li>
      <li><a href="index3.html".html">Horario</a></li>
      <li><a href="Formularios-cuestionario.html">Cuestionario</a></li>
    </ul>
  </nav>
  <main>
    <form action="#" method="post">
      <fieldset>
        <legend>Datos Personales</legend>
        <div class="rejilla">
          <p><label for="nombre">Nombre:</label><br><input type="text" id="nombre" name="nombre"></p>
          <p><label for="apellidos">Apellidos:</label><br><input type="text" id="apellidos" name="apellidos"></p>
          <p><label for="dni">DNI</label><br><input type="text" id="dni" name="dni"></p>
          <p><label for="localidad">Localidad de Nacimiento</label><br><input type="text" id="localidad" name="localidad"></p>
          <p><label for="provincia">Provincia:</label><br>
            <select id="provincia" name="provincia">
              <option>Huelva</option>
              <option>Sevilla</option>
              <option>Cádiz</option>
              <option>Córdoba</option>
              <option>Málaga</option>
              <option>Granada</option>
              <option>Jaén</option>
              <option>Almería</option>
            </select>
          </p>
          <p><label for="nacimiento">Fecha de Nacimiento</label><br><input type="date" id="nacimiento" name="nacimiento"></p>
          <p><label for="direccion">Dirección</label><br><input type="text" id="direccion" name="direccion"></p>
          <p><label for="cp">Código Postal:</label><br><input type="text" id="cp" name="cp"></p>
        </div>
      </fieldset>

      <fieldset>
        <legend>Forma de Acceso</legend>
        <p><input type="radio" id="directo" name="acceso" value="directo"><label for="directo">Directo</label></p>
        <div class="sangria">
          <p><input type="radio" id="bach" name="directo" value="bachillerato"><label for="bach">Bachillerato Log Modalidad</label> <input type="text" name="bach_modalidad"></p>
          <p><input type="radio" id="exp" name="directo" value="experimental"><label for="exp">Experimental</label></p>
          <p><input type="radio" id="cou" name="directo" value="cou"><label for="cou">COU Opción</label> <input type="text" name="cou_opcion"></p>
          <p><input type="radio" id="fp2" name="directo" value="fp2"><label for="fp2">FP2</label></p>
          <p><input type="radio" id="otros" name="directo" value="otros"><label for="otros">Otros (especifique)</label> <input type="text" name="otros_acceso"></p>
        </div>
        <p><input type="radio" id="libre" name="acceso" value="prueba-libre"><label for="libre">Prueba Libre</label></p>
      </fieldset>

      <fieldset>
        <legend>Documentos Adjuntos</legend>
        <p>
          <input type="checkbox" id="dni_doc" name="docs" value="dni"><label for="dni_doc">Fotocopia DNI</label>
          <input type="checkbox" id="cert" name="docs" value="certificado"><label for="cert">Certificado Académico</label>
        </p>
        <p><input type="checkbox" id="otros_doc" name="docs" value="otros"><label for="otros_doc">Otros documentos (especifique)</label> <input type="text" name="otros_documentos"></p>
      </fieldset>

      <p class="centro"><input type="submit" value="Enviar Solicitud"> <input type="reset" value="Limpiar datos"></p>
    </form>
  </main>
  <footer>
    <a href="index.html">Volver al menú principal</a>
    <p>Lenguajes de Marcas - Actividad 5: Formularios</p>
  </footer>
</body>
</html>
